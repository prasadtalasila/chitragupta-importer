[project]
name = "chitragupta-importer"
version = "0.3.0"
description = "Import reference-manager libraries into the papers/ directory chitragupta reads."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prasad Talasila" }]
requires-python = ">=3.12"
dependencies = [
    "bibtexparser>=1.4,<2",
    "click>=8.2",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
]

[project.scripts]
chitragupta-importer = "chitragupta_importer.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "pylint"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# Specs and plans quote code as it was proposed; they are records, not source.
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "BLE", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["chitragupta_importer"]

[tool.coverage.report]
fail_under = 98
